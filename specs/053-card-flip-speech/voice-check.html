<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地语音检查</title></head><body><div id="root"></div><ol id="voice-check" aria-label="实际音频播放记录" style="position:fixed;bottom:0;left:0;background:white;z-index:999;font-size:10px;max-height:60px;overflow:auto"></ol><script type="module">
// Diagnostic fixture only: use real audio and expose its events for read-only UI checks.
const NativeAudio=window.Audio;let seq=0;
window.Audio=function(src){const a=new NativeAudio(src);const row=document.createElement('li');row.dataset.audioSeq=String(++seq);row.dataset.src=src;row.dataset.state='created';row.textContent=src;document.querySelector('#voice-check').append(row);for(const event of ['playing','ended','error','pause'])a.addEventListener(event,()=>{row.dataset.state=event;row.textContent=event+' '+decodeURIComponent(src);});return a;};
await import('/src/main.tsx');
</script></body></html>
