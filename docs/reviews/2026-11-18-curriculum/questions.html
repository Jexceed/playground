":"点示范句听一听，再轮流说。需要时可以看图、做动作。","stim":"准备 一个小玩具 1）听听得到帮助的孩子和帮忙的朋友各说什么。 2）一个人帮忙递回玩具，另一个人接过玩具说谢谢，再听朋友回应。 3）交换角色；也可以换成帮忙递书，试着说同样的两句话。","options":"","answer":"由家长逐项记录。能用指图、动作或说话表示这句话的意思 / 能尝试跟说或用一句英语回应 / 能等对方说完，再轮到自己说","answerLabel":"家长观察项","feedback":"已记录家长选择的观察结果。","retry":"","parent":"是谁得到了帮助？为什么先说谢谢的是接过小熊的孩子？","proof":"","check":"家长记录流程已走通。复核时使用测试记录。","flags":[]},{"id":"everyday-english-sorry-choose","n":3,"group":"everyday-english-kind-words","stage":"探索","world":"语言花园","title":"谢谢与抱歉","type":"单选","p":"孩子不小心碰倒朋友的积木，想先说“对不起”。选哪一句？","ins":"点句子听英语，再点“选好了，看看”。","stim":"扎高马尾、穿粉色背带装的小女孩碰倒了蓝裙女孩搭的积木塔，看着散落的积木露出歉意。","options":"You're welcome.、That's OK.、I'm sorry.","answer":"I'm sorry.","answerLabel":"题库采纳的答案","feedback":"碰倒积木的孩子可以先道歉，再问问朋友需不需要帮忙重搭。","retry":"再想想现在是谁在说话，想表达什么。可以点句子再听听。","parent":"朋友还难过时，可以先听朋友说，不必催着回答没关系。除了道歉，我们还能怎样补救？","proof":"","check":"桌面界面已接受列出的作答。另提交过一个错误选项并收到重试反馈。","flags":[]},{"id":"everyday-english-sorry-talk","n":4,"group":"everyday-english-kind-words","stage":"探索","world":"语言花园","title":"谢谢与抱歉","type":"家长观察","p":"不小心碰倒了：和家长换角色说一说。","ins":"点示范句听一听，再轮流说。需要时可以看图、做动作。","stim":"准备 几块积木 1）听听道歉和回应。先商量好，一起演一次“不小心碰倒积木”。 2）碰倒积木的人道歉，另一人可以照着示范回应，也可以说自己还难过。 3）交换角色，再一起把积木搭好，想想道歉以后还能做什么。","options":"","answer":"由家长逐项记录。能用指图、动作或说话表示这句话的意思 / 能尝试跟说或用一句英语回应 / 能等对方说完，再轮到自己说","answerLabel":"家长观察项","feedback":"已记录家长选择的观察结果。","retry":"","parent":"朋友还难过时，可以先听朋友说，不必催着回答没关系。除了道歉，我们还能怎样补救？","proof":"","check":"家长记录流程已走通。复核时使用测试记录。","flags":[]}]},{"id":"everyday-english-asking","title":"我需要帮助","section":"探索","world":"语言花园","note":"先辨认请求者的目标，再听示范并结合动作尝试回应。","rows":[{"id":"everyday-english-water-choose","n":1,"group":"everyday-english-asking","stage":"探索","world":"语言花园","title":"我需要帮助","type":"单选","p":"孩子口渴了，想请家长给自己一点水。选哪一句？","ins":"点句子听英语，再点“选好了，看看”。","stim":"扎高马尾、穿粉色背带装的小女孩指向桌上的空杯子向家长请求喝水，家长拿着一壶饮用水准备倒水。","options":"No, thank you.、Here you are.、Can I have some water, please?","answer":"Can I have some water, please?","answerLabel":"题库采纳的答案","feedback":"想喝水时，可以礼貌地说出自己需要水。递水的人再回应“给你”。","retry":"再想想现在是谁在说话，想表达什么。可以点句子再听听。","parent":"哪句话说出了需要什么？如果只伸手，对方一定知道你想要水吗？","proof":"","check":"桌面界面已接受列出的作答。另提交过一个错误选项并收到重试反馈。","flags":[]},{"id":"everyday-english-water-talk","n":2,"group":"everyday-english-asking","stage":"探索","world":"语言花园","title":"我需要帮助","type":"家长观察","p":"我想喝点水：和家长换角色说一说。","ins":"点示范句听一听，再轮流说。需要时可以看图、做动作。","stim":"准备 一个杯子、一点饮用水，也可以先假装递水 1）指着杯子听请求，再听递水的人怎样回应。 2）孩子可以先跟着说关键词，再试着说整句；家长回应并递杯子。 3）交换角色。喝水时先停下说话，喝完再谢谢对方。","options":"","answer":"由家长逐项记录。能用指图、动作或说话表示这句话的意思 / 能尝试跟说或用一句英语回应 / 能等对方说完，再轮到自己说","answerLabel":"家长观察项","feedback":"已记录家长选择的观察结果。","retry":"","parent":"哪句话说出了需要什么？如果只伸手，对方一定知道你想要水吗？","proof":"","check":"家长记录流程已走通。复核时使用测试记录。","flags":[]},{"id":"everyday-english-help-choose","n":3,"group":"everyday-english-asking","stage":"探索","world":"语言花园","title":"我需要帮助","type":"单选","p":"孩子拉不上外套拉链，想请家长帮忙。选哪一句？","ins":"点句子听英语，再点“选好了，看看”。","stim":"扎高马尾、穿青绿色外套的小女孩拿着还没拉好的拉链望向家长，敞开的外套里露出粉色背带装，家长蹲下准备帮忙。","options":"I can do it.、Of course.、Can you help me, please?","answer":"Can you help me, please?","answerLabel":"题库采纳的答案","feedback":"遇到困难可以开口求助，再指一指需要帮忙的地方。家长愿意帮忙时可以回应“当然可以”。","retry":"再想想现在是谁在说话，想表达什么。可以点句子再听听。","parent":"为什么这里要请求帮助？同一句求助还能用在哪件小事上？","proof":"","check":"桌面界面已接受列出的作答。另提交过一个错误选项并收到重试反馈。","flags":[]},{"id":"everyday-english-help-talk","n":4,"group":"everyday-english-asking","stage":"探索","world":"语言花园","title":"我需要帮助","type":"家长观察","p":"请帮帮我：和家长换角色说一说。","ins":"点示范句听一听，再轮流说。需要时可以看图、做动作。","stim":"准备 一件带拉链的外套，也可以指着图演 1）找一找孩子需要帮助的地方，逐句听听请求和回应。 2）一个人指着拉链请求帮忙，另一个人回应，再一起完成。 3）交换角色。换成拿不到书的情境，试试同一句求助。","options":"","answer":"由家长逐项记录。能用指图、动作或说话表示这句话的意思 / 能尝试跟说或用一句英语回应 / 能等对方说完，再轮到自己说","answerLabel":"家长观察项","feedback":"已记录家长选择的观察结果。","retry":"","parent":"为什么这里要请求帮助？同一句求助还能用在哪件小事上？","proof":"","check":"家长记录流程已走通。复核时使用测试记录。","flags":[]}]}],"findings":[{"key":"01","level":"优先修复","title":"窄屏上，完成拼图必需的卡片在屏外","scope":"探索 · 图形金字塔 4–9，方格重建师 4–6","detail":"390 像素宽时，金字塔第 4 题必选的图6在横坐标 438–501 像素。方格重建师第 5 题的蓝格卡在 465–560 像素，第四列和两个供选卡也被裁掉。页面外层隐藏溢出，触屏模拟向左滑后按钮坐标未变。逐题对照卡池和例解，九题都至少缺一项必需输入。","action":"窄屏改为参照图、操作盘和卡池上下排列。验收时用手指从空盘摆到完成，覆盖第四列及卡池最后一列。","pics":[["evidence/touch-explore-recursive-composition-4.jpg","390 像素，金字塔第 4 题只露出部分卡池。"],["evidence/touch-explore-grid-copy-reconstruction-5.jpg","390 像素，方格重建师第 5 题缺少右侧和卡池。"]]},{"key":"02","level":"优先修复","title":"窄屏裁掉了需要计数的实物","scope":"启蒙 · 天平换一换 5–10，数一数 11–18，几个几个数 10–11","detail":"天平第 7 题的规则是一块纸杯蛋糕换三颗糖，390 像素宽的画面只露出第一颗糖。第 5、6、8–10 题也各有一个换算物完整落在题板外。数一数第 11–18 题的三组图标互相覆盖，部分还超出本组边界。第 16 题的糖果横跨 A、B、C 三个小框。几个几个数第 10、11 题的物体挤出所属组，第 11 题有一块积木完全在题板外。桌面数字答案能够正常提交。","action":"让换算关系整体缩放或换行，保持一个物体对应一个清晰图标。逐题确认模型中的物体在窄屏都能点到并数到。","pics":[["evidence/mobile-logic-balance-swap-7.jpg","同一条换算规则在 390 像素下只看得到一颗糖。"],["evidence/mobile-math-counting-cardinality-16.jpg","数一数第 16 题，三个小框之间的糖果叠在一起。"],["evidence/mobile-math-group-counting-11.jpg","五组积木的画面右边缘。"]]},{"key":"03","level":"优先修复","title":"图卡已经竖排，题目还在问左右","scope":"启蒙 · 一模一样在哪里 7–12，多一点，少一点 1–12，找不同侦探 1–12，积木楼层图 10–12，天平换一换 1–4","detail":"在 390 像素宽的作答画面，一模一样在哪里的三张样本在同一条竖线上，第 9 题仍只认“左边这张”。其余四组中，用“左边、右边”命名或提问的两盘证据变为上、下两盘。文字标签仍在，儿童看到的方位与听到的方位冲突。","action":"需要教左右的题保持横向连续，允许同向滑动。只要辨认图卡的题，让孩子直接点那张不同的卡。比较数量也可以用盘子图案作稳定标记。","pics":[["evidence/mobile-logic-visual-match-9.jpg","三张样本自上而下排列，选项仍要求指认左、中、右。"]]},{"key":"04","level":"优先修复","title":"题目要求保持高度，参照图和选项却用不同的比例显示","scope":"探索 · 转一转照一照 5–6","detail":"第 6 题要求“只把图案横向拉长，上下高度保持不变”。两张源图使用同一高度，桌面屏幕却把 320×320 的参照图放进 156×156 的区域，把候选图按 106 像素高显示。实际的正确图C比参照图矮约三分之一。第 5 题要找等比例放大，缩小候选卡也把应当显眼的增幅压到约 5%。","action":"题面和选项共用一个可见的网格单位或固定比例的底板。第 6 题应能用手指比出上边缘和下边缘等高，第 5 题的宽、高应同时明显增加。","pics":[["evidence/desktop-explore-rotation-reflection-6.jpg","桌面实拍，图C是系统认可的答案。"]]},{"key":"05","level":"优先修复","title":"“可以做什么”把继续等待也判错","scope":"启蒙 · 条件小侦探 3，错了怎么改 3","detail":"两题都写明绿灯、车辆已停，问和大人一起“可以”怎样做。实际点“继续等着”均进入重试。题面给足了可以过街的条件，却没有交代一定要此时出发。孩子选择再等一等也说得通。","action":"若目标是识别通行条件，可直接问“现在，能和大人一起过马路了吗？”保留绿灯、车辆和大人的线索。若想讨论孩子的决定，就允许说明选择。","pics":[]},{"key":"06","level":"优先修复","title":"分类题提出开放问题，却只认一个分类角度","scope":"启蒙 · 同类小侦探 8、11","detail":"第 8 题在汽车、公交车、飞机和蛋糕中只认蛋糕。孩子按“哪一个能飞”选飞机会被判错。第 11 题只认长木板。按“哪一个是树上长出来的”选橘子也会被判错。两个替代答案均在界面提交复现，题前只要求找三个的共同点。","action":"要保留单选，就在题前说明“按是不是交通工具”或“只看外形”。要练习自己找分类依据，就让家长听理由，同一道题可以有不同分法。","pics":[]},{"key":"07","level":"建议调整","title":"照抄左右编号就能完成形状配对","scope":"探索 · 关系接力 4–9","detail":"虽然右栏重排了，每题的“左图1”都可以连“右图1”，“左图2”也可以连“右图2”。六题都能靠同号全部答对。后三题的相同圆形允许互换，这个多解应保留。","action":"去掉成对的编号，或在排好两栏后按各自屏幕位置单独编号。连线后让孩子说说哪两张形状一样。","pics":[["evidence/desktop-explore-relations-analogies-7.jpg","右栏打乱了位置，左右同号仍然配得上。"]]},{"key":"08","level":"建议调整","title":"同一阶段换了题面，仍能按上一题的位置作答","scope":"探索 · 细心搜索员 1–9，分法找齐了吗 1–3","detail":"细心搜索员每三个变式换了形状，正确卡位却完全相同。第 1–3 题都选第 1、4、7 张，第 4–6 题都是第 4、13 张，第 7–9 题都是第 8、9、17、18 张。分法题的前三题则都是除了最后一张全选。","action":"保留规律可观察的图卡，重新安排每个变式的正确卡位和干扰项。复测时把上一题的点按位置原样用于下一题。","pics":[]},{"key":"09","level":"建议调整","title":"数量配对可以完全绕过记忆","scope":"探索 · 谁有几个 1–9","detail":"九题的兔、猫、熊、狗都按同一顺序得到从小到大的连续数量。即便右栏顺序打乱，直接把最小数连给小兔、次小数连给小猫，依次类推，九题都能通过。","action":"每题独立分配朋友和数量，至少加入小兔数量最多、朋友数量不随队伍顺序递增的变式。保留现有头像、点数和重看入口。","pics":[]},{"key":"10","level":"建议调整","title":"两句英语比较只听第一句就够了","scope":"探索 · 英语里的数量位置 7–9","detail":"三题播放完全相同的两句英语。正确图是红条长于蓝条、蓝条又长于黄条。另外两张图里的红条都短于蓝条。因此只检查第一句，每题已有唯一答案。","action":"让一个干扰项满足第一句、违反第二句，让另一个恰好相反。三个变式轮换比较对象或方向。","pics":[]},{"key":"11","level":"建议调整","title":"翻牌追问和实际动作不一致","scope":"探索 · 翻牌小机关 1–9","detail":"前六题没有任何一张牌要翻两次，家长提示却逐题问“哪张牌翻过两次”。后三题确实有重复翻牌，但只检查最后的牌面。第 7 题要求翻 1、2、1，实际只翻第 2 张也通过，第 8、9 题同样可只翻中间一步。","action":"前六题问“哪张变了”“哪张没变”。后三题可以邀请孩子比较两种翻法为何得到相同结果。如要记录是否依次执行，应把这件事单独观察。","pics":[]},{"key":"12","level":"建议调整","title":"题名承诺数的分解，作答连续 28 次都只求和","scope":"启蒙 · 合起来，拆开来 1–28","detail":"每题都给出两堆积木，只让孩子选总数。换一种分法只出现在家长追问里。孩子可以完成整组，同时从未在应用中补过缺少的一堆或摆出另一种分法。","action":"保留部分合成题，把一部分变式改成“合起来有 6 块，这边有 2 块，另一边有几块”或亲手分堆，并保留稳定题目身份和历史进度语义。","pics":[]},{"key":"13","level":"建议调整","title":"空白卡的教学题，所有空白卡都已经固定","scope":"探索 · 图形推理盘 6","detail":"三张空白卡已在第 1 行第 3 格、第 2 行第 2 格和第 3 行第 1 格。按每行每列各一张的规则，四个可编辑格里全都不能放空白卡。孩子只放圆形与方形，也会听到“空白卡也放在了合适的位置”。","action":"把至少一张空白卡的位置留给孩子补，或保留当前棋盘并将反馈写成“你避开了已经有空白卡的位置”。","pics":[]},{"key":"14","level":"建议调整","title":"对折题靠极小的外形差别区分正方形和菱形","scope":"探索 · 哪里可以对折 6","detail":"这张菱形两条对角线长 240 和 250 个源图单位。答案只收竖、横两条折线。压成小卡后，轮廓很像转过角度的正方形。多选另外两条线虽然与精确图形不符，视觉证据对孩子太弱。","action":"拉开两条对角线的长度，或让孩子点一条线观看对折、观察边缘是否重合。","pics":[["evidence/desktop-explore-symmetry-axes-6.jpg","题面菱形与四个候选折法。"]]},{"key":"15","level":"建议调整","title":"“大小不同”容易让孩子按尺寸去重","scope":"探索 · 点线面数清楚 7–9","detail":"系统数的是每一个不同位置的框。第 7 题的一排两格能找出 3 个框，但只有两种大小。题内线索和标框工具支持按位置计数，标题“大小不同的长方形一共有几个”容易引出另一个合理的计数口径。","action":"题干改成“这张图里一共能找到几个长方形？正方形也算”。保留对角点标记和重复框提示。","pics":[]},{"key":"16","level":"建议调整","title":"题面把电子钟默认成 24 小时制","scope":"启蒙 · 时钟小管家 9–12","detail":"题组目标写了 24 小时制，实际题面只说“电子钟”。第 11、12 题把 03:30 与 15:30、07:00 与 19:00 放在一起。懂得家中电子钟可用十二小时制的孩子，还需要猜这台钟的设置。","action":"先说明“这台电子钟用 24 小时计时”，用一个下午时刻示范，再保留早餐、午睡和晚饭的线索。","pics":[]},{"key":"17","level":"建议调整","title":"观察记录要求家长评价活动里未安排的行为","scope":"探索 · 节日和生活发现 1、3，用品放对地方 7，折开会怎样 1","detail":"节日第 1 题只讲家里的一件物品，却要求记录“能比较相同与不同”和“会提出一个有依据的问题”。第 3 题只有一个地点，也要求比较异同。用品第 7 题给杯子想新用途，却要求评价分类。折纸第 1 题直接剪开看结果，记录表还要求“先预测再操作”。界面要求家长为每一项都选一个结果。","action":"逐题对齐操作步骤与观察项。例如节日第 1 题记录孩子能否分清自己的回忆和家长补充的内容。折纸题在展开之前停下来让孩子先猜。","pics":[]},{"key":"18","level":"建议调整","title":"单张图卡在选项里变成了两个图标","scope":"启蒙 · 图形补一补 2、4，图卡少哪张 7–12，同类小侦探 7、10、11","detail":"候选卡先画本地插图，再把同一对象的 emoji 当文字显示。图形补一补第 2 题的空位只需要一个红圆，三个按钮却分别画了两个红、两个蓝和两个黄。数量或组合本来就是相邻题目的线索，这种重复会引导孩子误数。","action":"单个对象只保留一张图，文字和朗读使用名称。多对象的组合仍按题目实际数量绘制。","pics":[["evidence/desktop-logic-matrix-puzzle-2.jpg","题面每格一个对象，候选项的同色圆重复出现。"]]},{"key":"19","level":"课程改进","title":"题目请孩子分蛋糕，屏幕上的蛋糕只能点读","scope":"启蒙 · 公平分一分 1–13","detail":"图里给出蛋糕和小朋友，前九题说可以轮流分，点击蛋糕或孩子只会朗读名称。家长可以陪孩子用手指模拟。现有答题记录只反映选中了每人的份数，无法看出孩子是否做过逐个分配。","action":"可先在两三题放入能轮流分蛋糕的操作。其余选择题可与家长一起指着分，保留求剩余时“不切开”的条件。","pics":[]},{"key":"20","level":"课程改进","title":"操作材料或步骤没有体现变式之间的差异","scope":"探索 · 词语有朋友 7–9，变化观察册 7","detail":"词语三题分别练开关、长短和换情境，但给出相同材料“两个盒子或两条纸带”和相同三步，材料图也只有盒子。豆苗连续观察让家长按日期摆记录，材料只要求种子或豆苗、杯、纸笔。附带的是生长阶段图，首次活动缺少同一株的跨日记录。","action":"开关题给可开合的盒子，长短题给长度不同的纸带，迁移题点明第二个情境。豆苗活动给出首日版本，已有记录的家庭再做跨日比较。","pics":[]},{"key":"21","level":"通用交互","title":"多选题没有选择，提交也会增加一次错误尝试","scope":"探索 · 全部 93 道多选题","detail":"逐题验证 93 题均有至少一个正确项，空选均返回错误。在分类换个角度第 1 题实点提交，尝试数从 0 变成 1。单选题在相同情况下提示先选一个答案。","action":"正确集合非空且还没有勾选时，给“先点一张图卡”的提示，并保持尝试数。区分尚未作答与选错。","pics":[]},{"key":"22","level":"通用交互","title":"许多错答没有给孩子一个可重试的具体动作","scope":"探索 · 261 道单选题","detail":"实测给每道单选故意选一个错误项，其中 261 道返回同一句“再对照图和题目的条件，一步一步检查。”例如时钟题没有提示先看长针还是短针。听英语选位置图也没有提示重听哪个关系。","action":"优先给常见误判写一个可执行的追问。时钟可让孩子指长针落在哪个刻度，位置题可请孩子先指出被比较的参照物。","pics":[]},{"key":"23","level":"通用交互","title":"记忆题点重看或重听会清空已经摆好的内容","scope":"探索 · 99 道使用记忆流程的题或活动","detail":"当前流程把“再看一次”或“再听一次”当作从头回忆，会重置作答和撤销记录。位置藏起来等多格题中，孩子可能只想核对一个位置。实测位置藏起来第 4 题，已放小兔的第 1 格重看后恢复为空位。按钮上没有说明这项变化。","action":"若采用完整重做，按钮或操作前的说明写清“重新看，再从头摆”。若要支持局部核对，可保留已摆卡片并照常记录重看次数。","pics":[]}]}</script>
<script>
const data=JSON.parse(document.getElementById('audit-data').textContent);
const byIssue=new Map(data.findings.map(f=>[f.key,f]));
const $=id=>document.getElementById(id);
function node(tag,value,cls){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;if(cls)e.className=cls;return e}
for(const f of data.findings){const o=node('option',f.key+' '+f.title);o.value=f.key;$('finding').append(o)}
function issueLink(key,txt){const a=node('a',txt);a.href='#finding='+key;a.addEventListener('click',()=>{if(location.hash===a.hash)readUrl();});return a}
function tag(text,hot){return node('span',text,'tag'+(hot?' hot':''))}
function figures(f,area){for(const [path,caption] of f.pics){const fig=node('figure');const a=node('a');a.href=path;const img=node('img');img.src=path;img.alt=caption;img.loading='lazy';a.append(img);fig.append(a,node('figcaption',caption));area.append(fig)}}
function showIssue(id){const target=$('issue');target.replaceChildren();const f=byIssue.get(id);if(!f)return;const area=node('section',undefined,'issue');area.append(node('h2',f.title),node('p',f.scope,'meta'),node('p',f.detail),node('p','建议调整　'+f.action));figures(f,area);target.append(area)}
function detail(r){
 const box=node('details',undefined,'question'),sum=node('summary');sum.append(document.createTextNode('第 '+r.n+' 题　'+r.p+' '));const levels=[...new Set(r.flags.map(k=>byIssue.get(k).level))];for(const l of levels)sum.append(tag(l,l==='优先修复'));box.append(sum);
 const show=()=>{if(!box.open||box.children.length>1)return;const div=node('div',undefined,'info');div.append(node('div',r.id+'　·　'+r.type,'gid'));const dl=node('dl');
 for(const [t,v] of [['作答指令',r.ins],['题面线索与步骤',r.stim],['候选项或材料卡',r.options],[r.answerLabel,r.answer],['题内反馈',r.feedback],['重试时的反馈',r.retry],['给家长的追问',r.parent],['独立核对依据',r.proof]]){if(!v)continue;dl.append(node('dt',t),node('dd',v))}
 div.append(dl);const checked=node('p',r.check+' 390 像素宽的作答画面已检查。','proof');div.append(checked);
 if(r.flags.length){const list=node('div',undefined,'flags');for(const id of r.flags){const f=byIssue.get(id);list.append(issueLink(id,id+' '+f.title));}div.append(list)}
 else div.append(node('p','本轮未记录本题的个别问题。儿童实际理解仍需共玩观察。','hint'));
 box.append(div)};box.addEventListener('toggle',show);return box;
}
function matches(r,term,level,finding){if(finding&&!r.flags.includes(finding))return false;if(level==='未另列个别问题'){if(r.flags.some(k=>byIssue.get(k).level!=='通用交互'))return false}else if(level&&!r.flags.some(k=>byIssue.get(k).level===level))return false;return !term||[r.id,r.title,r.p,r.stage,r.world,r.title+'第'+r.n+'题',r.group].join(' ').toLowerCase().includes(term)}
function render(){const t=$('query').value.trim().toLowerCase(),s=$('section').value,lv=$('level').value,f=$('finding').value;const items=[];let count=0;for(const g of data.groups){if(s&&g.section!==s)continue;const rows=g.rows.filter(r=>matches(r,t,lv,f));if(rows.length){items.push([g,rows]);count+=rows.length}}
 $('count').textContent='当前显示 '+items.length+' 个题组、'+count+' 项。';showIssue(f);const parent=$('groups');parent.replaceChildren();if(!count){parent.append(node('p','没有符合条件的题目。'));return}
 for(const [g,rows] of items){const box=node('details',undefined,'group'),sum=node('summary');sum.append(document.createTextNode(g.title+'　'),node('span',g.section+' · '+g.world,'gid'),node('small',rows.length+' / '+g.rows.length+' 项'));box.append(sum);parent.append(box);
 const fill=()=>{if(!box.open||box.children.length>1)return;box.append(node('p',g.note,'groupnote'));for(const row of rows){const q=detail(row);box.append(q);if(t&&count===1)q.open=true}};box.addEventListener('toggle',fill);if(t||f||items.length===1){box.open=true;fill()}}
}
function readUrl(){const p=new URLSearchParams(location.hash.slice(1));$('query').value=p.get('q')||'';$('section').value=p.get('stage')||'';$('level').value=p.get('level')||'';$('finding').value=p.get('finding')||'';render()}
function fromForm(){const p=new URLSearchParams();for(const [k,id] of [['q','query'],['stage','section'],['level','level'],['finding','finding']]){if($(id).value)p.set(k,$(id).value)}history.replaceState(null,'',p.size?'#'+p.toString():location.pathname);render()}
$('query').addEventListener('input',fromForm);for(const id of ['section','level','finding'])$(id).addEventListener('change',fromForm);$('clear').addEventListener('click',()=>{for(const id of ['query','section','level','finding'])$(id).value='';fromForm()});window.addEventListener('hashchange',readUrl);readUrl();
</script></body></html>
