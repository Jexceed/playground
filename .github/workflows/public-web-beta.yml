name: Public Web Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-web-beta
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  VITE_BASE_PATH: /playground/

jobs:
  build:
    name: Build verified Web Beta
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test public Web release contract
        run: pnpm test:web-release

      - name: Build subpath-hosted application
        run: pnpm build

      - name: Audit curriculum
        run: pnpm audit:curriculum

      - name: Audit local voice media
        run: pnpm audit:voice-media

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish Web Beta
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

